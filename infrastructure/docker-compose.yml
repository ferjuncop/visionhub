# Servicios propios de VisionHub.
# Todos los contenedores empiezan por "vh-", usan su propia red
# y solo escuchan en 127.0.0.1 (nunca abiertos a internet).
name: vh

services:
  postgres:
    image: postgres:17-alpine
    container_name: vh-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:${POSTGRES_PORT}:5432"
    volumes:
      - vh-postgres-data:/var/lib/postgresql/data
    networks: [vh-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    deploy:
      resources:
        limits:
          memory: 256m

networks:
  vh-net:
    name: vh-net

volumes:
  vh-postgres-data:
    name: vh-postgres-data
